name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  evaluate:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Leaderboard of all built-in systems
        run: |
          evalkit leaderboard --out results
          { echo "### Leaderboard"; echo; cat results/leaderboard.md; } >> "$GITHUB_STEP_SUMMARY"
      - name: Leaderboard on the SQuAD v2.0 sample
        run: |
          evalkit leaderboard --corpus datasets/squad-v2-sample/corpus.jsonl             --golden datasets/squad-v2-sample/golden.jsonl --out results/squad-v2
          { echo; echo "### Leaderboard: SQuAD v2.0 sample"; echo; cat results/squad-v2/leaderboard.md; } >> "$GITHUB_STEP_SUMMARY"
      - name: LLM-backed system, replayed from the committed response cache
        env:
          EVALKIT_LLM_OFFLINE: "1"
        run: |
          evalkit run --system evalkit.llm:make --corpus datasets/squad-v2-sample/corpus.jsonl             --golden datasets/squad-v2-sample/golden.jsonl --out results/llm-squad
          evalkit run --system bm25-extractive --corpus datasets/squad-v2-sample/corpus.jsonl             --golden datasets/squad-v2-sample/golden.jsonl --out results/bm25-squad > /dev/null
          {
            echo; echo "### LLM-backed RAG on the SQuAD v2.0 sample (replayed from cache)"; echo
            cat results/llm-squad/evalkit-llm-make.md; echo
            python scripts/error_breakdown.py results/bm25-squad/bm25-extractive.json               results/llm-squad/evalkit-llm-make.json
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Regression gate against the committed baseline
        run: |
          set +e
          evalkit gate | tee results/gate.md
          status=${PIPESTATUS[0]}
          { echo; echo "### Regression gate"; echo; cat results/gate.md; } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: results/
