name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  evaluate:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Leaderboard of all built-in systems
        run: |
          evalkit leaderboard --out results
          { echo "### Leaderboard"; echo; cat results/leaderboard.md; } >> "$GITHUB_STEP_SUMMARY"
      - name: Regression gate against the committed baseline
        run: |
          set +e
          evalkit gate | tee results/gate.md
          status=${PIPESTATUS[0]}
          { echo; echo "### Regression gate"; echo; cat results/gate.md; } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: results/
